<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧠 Super AI</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #12121a;
    --card:     #1a1a26;
    --border:   #2a2a3e;
    --accent:   #6c63ff;
    --accent2:  #ff6b9d;
    --text:     #e8e8f0;
    --muted:    #6b6b8a;
    --success:  #00d4aa;
    --radius:   16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .header-title {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }

  .title-text h1 { font-size: 18px; font-weight: 700; }
  .title-text p  { font-size: 12px; color: var(--muted); margin-top: 1px; }

  .header-actions { display: flex; gap: 8px; }

  .btn-icon {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 14px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    transition: all .2s;
  }
  .btn-icon:hover { background: var(--border); }

  /* ── Models Bar ── */
  .models-bar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 20px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
    scrollbar-width: none;
  }
  .models-bar::-webkit-scrollbar { display: none; }

  .model-chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    white-space: nowrap;
    color: var(--muted);
    transition: all .2s;
  }
  .model-chip.active {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(108,99,255,.1);
  }

  /* ── Chat Area ── */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .welcome {
    text-align: center;
    padding: 40px 20px;
    opacity: .7;
  }
  .welcome .big-emoji { font-size: 60px; margin-bottom: 16px; }
  .welcome h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
  .welcome p  { font-size: 14px; color: var(--muted); }

  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 20px;
  }
  .suggestion {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    cursor: pointer;
    transition: all .2s;
    font-family: 'Cairo', sans-serif;
    color: var(--text);
  }
  .suggestion:hover { border-color: var(--accent); color: var(--accent); }

  /* ── Messages ── */
  .message { display: flex; gap: 12px; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  .message.user  { flex-direction: row-reverse; }

  .avatar {
    width: 36px; height: 36px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .message.user  .avatar { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
  .message.ai    .avatar { background: var(--card); border: 1px solid var(--border); }

  .bubble {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: var(--radius);
    line-height: 1.7;
    font-size: 14.5px;
  }
  .message.user .bubble {
    background: linear-gradient(135deg, var(--accent), #8b85ff);
    border-radius: var(--radius) 4px var(--radius) var(--radius);
  }
  .message.ai .bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px var(--radius) var(--radius) var(--radius);
  }

  .model-tag {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .model-tag .dot {
    width: 6px; height: 6px;
    background: var(--success);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:.4;} }

  .rag-badge {
    display: inline-block;
    background: rgba(0,212,170,.1);
    border: 1px solid rgba(0,212,170,.3);
    color: var(--success);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
  }

  .tool-badge {
    display: inline-block;
    background: rgba(255,107,157,.1);
    border: 1px solid rgba(255,107,157,.3);
    color: var(--accent2);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    margin-right: 6px;
  }

  /* ── Typing ── */
  .typing .bubble { padding: 16px 20px; }
  .typing-dots { display: flex; gap: 6px; align-items: center; }
  .typing-dots span {
    width: 8px; height: 8px;
    background: var(--muted);
    border-radius: 50%;
    animation: bounce .8s infinite;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .30s; }
  @keyframes bounce { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-6px);} }

  /* ── Input Area ── */
  .input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px 20px;
    flex-shrink: 0;
  }

  .upload-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    font-size: 12px;
    color: var(--muted);
  }

  .upload-bar label {
    background: var(--card);
    border: 1px dashed var(--border);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all .2s;
    color: var(--muted);
  }
  .upload-bar label:hover { border-color: var(--accent); color: var(--accent); }
  #file-input { display: none; }

  .kb-info {
    color: var(--success);
    font-size: 12px;
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  #message-input {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 16px;
    border-radius: 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 15px;
    resize: none;
    outline: none;
    transition: border-color .2s;
    max-height: 120px;
    overflow-y: auto;
  }
  #message-input:focus { border-color: var(--accent); }
  #message-input::placeholder { color: var(--muted); }

  .send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none;
    color: white;
    width: 48px; height: 48px;
    border-radius: 14px;
    cursor: pointer;
    font-size: 20px;
    transition: transform .2s, opacity .2s;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .send-btn:hover   { transform: scale(1.05); }
  .send-btn:active  { transform: scale(0.95); }
  .send-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── Code blocks ── */
  pre {
    background: #0d0d14;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    overflow-x: auto;
    margin: 10px 0;
    font-size: 13px;
    direction: ltr;
    text-align: left;
  }
  code { font-family: 'Courier New', monospace; }

  @media (max-width: 600px) {
    .bubble { max-width: 88%; font-size: 14px; }
    .header { padding: 10px 16px; }
    .chat-area { padding: 16px 12px; }
    .input-area { padding: 12px 16px; }
  }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-title">
    <div class="logo">🧠</div>
    <div class="title-text">
      <h1>Super AI</h1>
      <p>9 موديلات ذكية</p>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" onclick="clearChat()">🗑️ مسح</button>
  </div>
</div>

<!-- Models Bar -->
<div class="models-bar" id="models-bar">
  <div class="model-chip">جاري التحميل...</div>
</div>

<!-- Chat Area -->
<div class="chat-area" id="chat-area">
  <div class="welcome">
    <div class="big-emoji">🧠</div>
    <h2>مرحباً! أنا Super AI</h2>
    <p>9 موديلات ذكية في خدمتك — اسأل أي حاجة!</p>
    <div class="suggestions">
      <button class="suggestion" onclick="send('اكتبلي كود Python يرتب list')">💻 كتابة كود</button>
      <button class="suggestion" onclick="send('احسب 15% من 8500')">🧮 حساب</button>
      <button class="suggestion" onclick="send('اشرحلي الذكاء الاصطناعي')">🤖 شرح AI</button>
      <button class="suggestion" onclick="send('اكتبلي قصيدة عن النيل')">✍️ إبداع</button>
      <button class="suggestion" onclick="send('النهارده إيه التاريخ؟')">📅 التاريخ</button>
    </div>
  </div>
</div>

<!-- Input Area -->
<div class="input-area">
  <div class="upload-bar">
    <label for="file-input">📎 رفع ملف (PDF أو TXT)</label>
    <input type="file" id="file-input" accept=".pdf,.txt" onchange="uploadFile(this)">
    <span class="kb-info" id="kb-info"></span>
  </div>
  <div class="input-row">
    <textarea id="message-input" placeholder="اكتب سؤالك هنا..." rows="1"
      onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">➤</button>
  </div>
</div>

<script>
// ── Load Models ──
async function loadModels() {
  try {
    const res    = await fetch('/models');
    const models = await res.json();
    const bar    = document.getElementById('models-bar');
    bar.innerHTML = models.map(m =>
      `<div class="model-chip" id="chip-${m.key}">${m.name}</div>`
    ).join('');
  } catch(e) {}
}

// ── Highlight active model ──
function highlightModel(domain) {
  document.querySelectorAll('.model-chip').forEach(c => c.classList.remove('active'));
  const chip = document.getElementById(`chip-${domain}`);
  if (chip) chip.classList.add('active');
}

// ── Auto resize textarea ──
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// ── Handle Enter key ──
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Add message to UI ──
function addMessage(role, content, meta = {}) {
  const area = document.getElementById('chat-area');

  const welcome = area.querySelector('.welcome');
  if (welcome) welcome.remove();

  const div = document.createElement('div');
  div.className = `message ${role}`;

  if (role === 'user') {
    div.innerHTML = `
      <div class="avatar">👤</div>
      <div class="bubble">${escapeHtml(content)}</div>
    `;
  } else {
    const ragBadge  = meta.rag_used  ? `<span class="rag-badge">📚 RAG</span>` : '';
    const toolBadge = meta.tool      ? `<span class="tool-badge">🛠️ ${meta.tool}</span>` : '';
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div>
        <div class="model-tag">
          <span class="dot"></span>
          ${meta.model || ''}
          ${ragBadge}${toolBadge}
        </div>
        <div class="bubble">${formatContent(content)}</div>
      </div>
    `;
    if (meta.domain) highlightModel(meta.domain);
  }

  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

// ── Typing indicator ──
function showTyping() {
  const area = document.getElementById('chat-area');
  const div  = document.createElement('div');
  div.className = 'message ai typing';
  div.id        = 'typing';
  div.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">
      <div class="typing-dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}

// ── Send message ──
async function sendMessage() {
  const input = document.getElementById('message-input');
  const btn   = document.getElementById('send-btn');
  const text  = input.value.trim();
  if (!text) return;

  input.value  = '';
  input.style.height = 'auto';
  btn.disabled = true;

  addMessage('user', text);
  showTyping();

  try {
    const res  = await fetch('/chat', {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body:    JSON.stringify({ message: text })
    });
    const data = await res.json();
    hideTyping();
    addMessage('ai', data.answer, data);
  } catch(e) {
    hideTyping();
    addMessage('ai', '❌ خطأ في الاتصال', {});
  }

  btn.disabled = false;
  input.focus();
}

// ── Suggestion send ──
function send(text) {
  document.getElementById('message-input').value = text;
  sendMessage();
}

// ── Upload file ──
async function uploadFile(input) {
  const file = input.files[0];
  if (!file) return;

  const info = document.getElementById('kb-info');
  info.textContent = '⏳ جاري الرفع...';

  const form = new FormData();
  form.append('file', file);

  try {
    const res  = await fetch('/upload', { method: 'POST', body: form });
    const data = await res.json();
    info.textContent = data.message;
  } catch(e) {
    info.textContent = '❌ فشل الرفع';
  }
  input.value = '';
}

// ── Clear chat ──
async function clearChat() {
  await fetch('/clear', { method: 'POST' });
  const area = document.getElementById('chat-area');
  area.innerHTML = `
    <div class="welcome">
      <div class="big-emoji">🧠</div>
      <h2>المحادثة اتمسحت!</h2>
      <p>ابدأ محادثة جديدة 👇</p>
    </div>
  `;
  document.querySelectorAll('.model-chip').forEach(c => c.classList.remove('active'));
}

// ── Format content (handle code blocks) ──
function formatContent(text) {
  text = escapeHtml(text);
  text = text.replace(/```(\w*)\n?([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  text = text.replace(/`([^`]+)`/g, '<code style="background:#0d0d14;padding:2px 6px;border-radius:4px;">$1</code>');
  text = text.replace(/\n/g, '<br>');
  return text;
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Init ──
loadModels();
document.getElementById('message-input').focus();
</script>
</body>
</html>
